<div class="min-h-screen bg-body transition-colors duration-300">
  <!-- Desktop Sidebar -->
  <aside
    class="hidden lg:flex lg:flex-col lg:fixed lg:inset-y-0 lg:w-64 bg-card border-r border-theme z-30 transition-colors duration-300 shadow-sm"
  >
    <!-- Logo -->
    <div class="flex items-center gap-3 p-6 border-b border-theme">
      <div class="flex items-center justify-center w-10 h-10 bg-primary-600 rounded-lg text-white shadow-lg shadow-primary-500/30">
        <i class="pi pi-diamond text-xl"></i>
      </div>
      <div>
        <h1 class="text-xl font-bold text-main tracking-tight">Jewellify</h1>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto custom-scrollbar">
      <a
        *ngFor="let item of menuItems"
        [routerLink]="item.routerLink"
        routerLinkActive="bg-indigo-50 border-primary-600 text-primary-800 font-semibold shadow-sm"
        class="flex items-center gap-3 px-4 py-3 border-l-4 border-transparent rounded-lg text-secondary hover:bg-slate-100 hover:text-primary-900 transition-all duration-200 group"
      >
        <i [class]="item.icon + ' text-lg group-hover:scale-110 transition-transform'"></i>
        <span>{{ item.label }}</span>
      </a>
    </nav>

    <!-- User Profile & Footer -->
    <div class="p-4 border-t border-theme bg-surface-50 dark:bg-surface-900/50">
      <div class="bg-card rounded-xl p-4 border border-theme shadow-sm">
        <div class="flex items-center gap-3 mb-4">
          <p-avatar
            [label]="(currentUser?.userName?.charAt(0) || 'U').toUpperCase()"
            shape="circle"
            size="large"
            styleClass="bg-primary-600 text-white font-bold shadow-md"
          ></p-avatar>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-bold truncate text-main">
              {{ currentUser?.userName || 'User' }}
            </p>
            <p class="text-xs text-secondary truncate">{{ currentUser?.email || '' }}</p>
          </div>
        </div>
        
          <div class="flex items-center justify-between pt-3 border-t border-theme">
            <div class="flex items-center gap-2">
              <p-tag [value]="currentUser?.role" severity="info" styleClass="text-xs h-7 px-2"></p-tag>
              <button
                pButton
                icon="pi pi-power-off"
                (click)="onLogout()"
                styleClass="p-button-text p-button-danger p-button-sm w-9 h-9 rounded-full p-0 flex items-center justify-center hover:bg-red-50 dark:hover:bg-red-900/20"
                pTooltip="Logout"
                tooltipPosition="top"
              ></button>
            </div>
          </div>
      </div>
    </div>
  </aside>

  <!-- Mobile Sidebar (Drawer) -->
  <p-drawer [(visible)]="sidebarVisible" [baseZIndex]="1000" styleClass="lg:hidden w-72">
    <ng-template pTemplate="header">
      <div class="flex items-center gap-3">
        <div class="flex items-center justify-center w-10 h-10 bg-primary-600 rounded-lg shadow-md">
          <i class="pi pi-diamond text-xl text-white"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold text-main">Jewellify</h1>
        </div>
      </div>
    </ng-template>

    <nav class="space-y-2 mt-4">
      <a
        *ngFor="let item of menuItems"
        [routerLink]="item.routerLink"
        routerLinkActive="bg-primary-50 border-primary-500 text-primary-700 font-semibold dark:bg-primary-500/20 dark:text-primary-400"
        (click)="sidebarVisible = false"
        class="flex items-center gap-3 px-4 py-3 border-l-4 border-transparent rounded-lg text-secondary hover:bg-surface-50 dark:hover:bg-surface-100 transition-all duration-200"
      >
        <i [class]="item.icon + ' text-lg'"></i>
        <span>{{ item.label }}</span>
      </a>
    </nav>

    <ng-template pTemplate="footer">
      <div class="border-t border-theme pt-4">
        <div class="bg-surface-50 dark:bg-surface-800 rounded-xl p-4 mb-3 border border-theme">
          <div class="flex items-center gap-3 mb-4">
            <p-avatar
              [label]="(currentUser?.userName?.charAt(0) || 'U').toUpperCase()"
              shape="circle"
              size="large"
              styleClass="bg-primary-600 text-white font-bold"
            ></p-avatar>
            <div class="flex-1 min-w-0">
              <p class="text-sm font-bold truncate text-main">
                {{ currentUser?.userName || 'User' }}
              </p>
              <p class="text-xs text-secondary truncate">{{ currentUser?.email || '' }}</p>
            </div>
          </div>
          
          <div class="grid grid-cols-2 gap-3">
            <button
              pButton
              [label]="themeService.theme() === 'dark' ? 'Light' : 'Dark'"
              [icon]="themeService.theme() === 'dark' ? 'pi pi-sun' : 'pi pi-moon'"
              (click)="toggleTheme()"
              styleClass="p-button-outlined p-button-secondary w-full text-sm"
            ></button>
            <button
              pButton
              label="Logout"
              icon="pi pi-power-off"
              (click)="onLogout(); sidebarVisible = false"
              styleClass="p-button-outlined p-button-danger w-full text-sm"
            ></button>
          </div>
        </div>
      </div>
    </ng-template>
  </p-drawer>

  <!-- Main Content Wrapper -->
  <div class="lg:pl-64 transition-all duration-300 flex flex-col min-h-screen">
    <!-- Mobile Header -->
    <header class="lg:hidden sticky top-0 z-20 bg-card/80 backdrop-blur-md border-b border-theme px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <p-button
          icon="pi pi-bars"
          (onClick)="toggleSidebar()"
          [text]="true"
          severity="secondary"
          styleClass="w-10 h-10"
        ></p-button>
        <div class="flex items-center gap-2">
          <i class="pi pi-diamond text-primary-600 text-xl"></i>
          <h1 class="text-lg font-bold text-main">Jewellify</h1>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button 
          pButton 
          [icon]="themeService.theme() === 'dark' ? 'pi pi-sun' : 'pi pi-moon'" 
          (click)="toggleTheme()" 
          styleClass="p-button-text p-button-secondary p-button-rounded w-10 h-10"
        ></button>
        <p-avatar
          [label]="(currentUser?.userName?.charAt(0) || 'U').toUpperCase()"
          shape="circle"
          styleClass="bg-primary-600 text-white shadow-sm"
        ></p-avatar>
      </div>
    </header>

    <!-- Page Content -->
    <main class="flex-1 pb-20 lg:pb-8 bg-body transition-colors duration-300">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Mobile Bottom Navigation -->
  <nav class="lg:hidden fixed bottom-0 left-0 right-0 bg-card border-t border-theme z-20 pb-safe">
    <div class="grid grid-cols-5 gap-1 p-2">
      <a
        [routerLink]="'/dashboard'"
        routerLinkActive="text-primary-600 font-semibold"
        class="flex flex-col items-center gap-1 py-2 px-1 text-secondary hover:text-primary-600 transition-colors"
      >
        <i class="pi pi-home text-xl"></i>
        <span class="text-[10px]">Home</span>
      </a>
      <a
        [routerLink]="'/inventory'"
        routerLinkActive="text-primary-600 font-semibold"
        class="flex flex-col items-center gap-1 py-2 px-1 text-secondary hover:text-primary-600 transition-colors"
      >
        <i class="pi pi-box text-xl"></i>
        <span class="text-[10px]">Stock</span>
      </a>
      <a
        [routerLink]="'/customers'"
        routerLinkActive="text-primary-600 font-semibold"
        class="flex flex-col items-center gap-1 py-2 px-1 text-secondary hover:text-primary-600 transition-colors"
      >
        <i class="pi pi-users text-xl"></i>
        <span class="text-[10px]">People</span>
      </a>
      <a
        [routerLink]="'/orders'"
        routerLinkActive="text-primary-600 font-semibold"
        class="flex flex-col items-center gap-1 py-2 px-1 text-secondary hover:text-primary-600 transition-colors"
      >
        <i class="pi pi-shopping-cart text-xl"></i>
        <span class="text-[10px]">Orders</span>
      </a>
      <button
        (click)="toggleSidebar()"
        class="flex flex-col items-center gap-1 py-2 px-1 text-secondary hover:text-primary-600 transition-colors"
      >
        <i class="pi pi-ellipsis-h text-xl"></i>
        <span class="text-[10px]">Menu</span>
      </button>
    </div>
  </nav>
</div>
